version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: honeyuser
      POSTGRES_PASSWORD: honeypassword
      POSTGRES_DB: honeydb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI Backend Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql://honeyuser:honeypassword@postgres:5432/honeydb
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./backend/app:/app/app

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8005
    depends_on:
      - backend

  # IoT Simulator
  iot-simulator:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./iot/simulator:/app
    command: python simulator.py --scenario DEMO_MODE
    depends_on:
      - backend

volumes:
  postgres_data:
