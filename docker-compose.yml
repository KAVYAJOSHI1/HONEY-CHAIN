services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: honeyuser
      POSTGRES_PASSWORD: honeypassword
      POSTGRES_DB: honeydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeyuser -d honeydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8005:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://honeyuser:honeypassword@postgres:5432/honeydb
      FRONTEND_URL: http://localhost:3005
      CORS_ORIGINS: http://localhost:3005
      AUTO_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/system-health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time — must be reachable from the user's browser.
        NEXT_PUBLIC_API_URL: http://localhost:8005
    ports:
      - "3005:3000"
    depends_on:
      - backend

  iot-simulator:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./iot/simulator:/app:ro
    environment:
      API_URL: http://backend:8000/telemetry
      PYTHONUNBUFFERED: "1"
    command: python simulator.py --scenario NORMAL --hives 3,6,9,13,17 --interval 15
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
